[package]
name = "soundtouch"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[dependencies]
wasm-bindgen = "0.2"
soundtouch-rs = { git = "https://github.com/apoint123/soundtouch-rs.git", rev = "3e1b9014018a66c7d419e051ab8c2b91c8e93e92" }
